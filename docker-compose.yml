# ══════════════════════════════════════════════════════════════════════════════
#  AskYourData — docker-compose.yml
#  Services : postgres_nl2sql (pgvector), schema_service, api_service
#  Aucun GPU requis : les LLM sont appelés via API (voir documentation/ARCHITECTURE.md)
#
#  Prérequis : démarrer d'abord docker-compose.odoo.yml, qui crée le réseau nl2sql_net
# ══════════════════════════════════════════════════════════════════════════════

# Même Dockerfile pour les deux services, sans nom d'image commun : chaque service
# reçoit sa propre étiquette (le second build réutilise le cache, il est quasi instantané).
# Un nom d'image partagé fait échouer les builds parallèles (« image … already exists »).
x-common-cpu: &common-cpu
  build:
    context: .
    dockerfile: Dockerfile.cpu
    target: final
  pull_policy: build
  restart: unless-stopped
  networks:
    - nl2sql_net

# Nom de projet explicite : les deux fichiers sont dans le même dossier ; sans nom distinct,
# « --remove-orphans » sur l'un supprimerait les conteneurs de l'autre.
name: askyourdata

services:

  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16 + pgvector — métadonnées et embeddings
  # ─────────────────────────────────────────────────────────────────────────
  postgres_nl2sql:
    image: pgvector/pgvector:pg16
    container_name: nl2sql_postgres
    restart: unless-stopped
    networks:
      - nl2sql_net
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB:       nl2sql
      POSTGRES_USER:     nl2sql
      POSTGRES_PASSWORD: ${NL2SQL_DB_PASSWORD:-nl2sql}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_nl2sql_data:/var/lib/postgresql/data
      # Scripts exécutés uniquement à la création du volume
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nl2sql -d nl2sql"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────
  # schema_service — indexation + recherche de schéma (embedder local, CPU)
  # ─────────────────────────────────────────────────────────────────────────
  schema_service:
    <<: *common-cpu
    container_name: nl2sql_schema
    command: python3 -m schema_service.server
    ports:
      - "8002:8002"
    volumes:
      - ./models/all-MiniLM-L6-v2:/app/models/all-MiniLM-L6-v2:ro
      # Filtres d'indexation modifiables sans reconstruire l'image
      - ./config:/app/config:ro
    environment:
      MINILM_MODEL_PATH:   /app/models/all-MiniLM-L6-v2
      INDEX_FILTERS_PATH:  /app/config/index_filters.yaml
      NL2SQL_DB_HOST:      postgres_nl2sql
      NL2SQL_DB_PORT:      "5432"
      NL2SQL_DB_NAME:      nl2sql
      NL2SQL_DB_USER:      nl2sql
      NL2SQL_DB_PASSWORD:  ${NL2SQL_DB_PASSWORD:-nl2sql}
      # Base source du compte par défaut (id=1), synchronisée au démarrage
      SOURCE_DB_HOST:      ${SOURCE_DB_HOST:-postgres_odoo}
      SOURCE_DB_PORT:      ${SOURCE_DB_PORT:-5432}
      SOURCE_DB_NAME:      ${SOURCE_DB_NAME:-odoo}
      SOURCE_DB_USER:      ${SOURCE_DB_USER:-odoo}
      SOURCE_DB_SCHEMA:    ${SOURCE_DB_SCHEMA:-public}
      SOURCE_DB_PASSWORD:  ${ODOO_DB_PASSWORD:-odoo}
      SEARCH_SYNONYMS_PATH: /app/config/search_synonyms.yaml
      SEARCH_SEED_TABLES:  "5"
      SEARCH_MAX_TABLES:   "10"
      SEARCH_MAX_COLUMNS:  "15"
      SCHEMA_TOKEN_BUDGET: "3000"
      # legacy (score unique) | coverage (tables puis colonnes par table, rareté, couverture)
      SEARCH_MODE:         ${SEARCH_MODE:-legacy}
      SEARCH_CANDIDATE_TABLES:     ${SEARCH_CANDIDATE_TABLES:-10}
      SEARCH_COVERAGE_WEIGHT:      ${SEARCH_COVERAGE_WEIGHT:-0.6}
      SEARCH_MIN_ELEMENT_STRENGTH: ${SEARCH_MIN_ELEMENT_STRENGTH:-0.3}
      SEARCH_COVER_RATIO:          ${SEARCH_COVER_RATIO:-0.8}
      SEARCH_MIN_COVERAGE_GAIN:    ${SEARCH_MIN_COVERAGE_GAIN:-0.15}
      OMP_NUM_THREADS:     "8"
      TOKENIZERS_PARALLELISM: "false"
      CUDA_VISIBLE_DEVICES: ""
    depends_on:
      postgres_nl2sql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # api_service — orchestrateur public (CPU)
  # ─────────────────────────────────────────────────────────────────────────
  api_service:
    <<: *common-cpu
    container_name: askyourdata_api
    command: >
      gunicorn
        --bind 0.0.0.0:5000
        --workers 4
        --threads 4
        --timeout 180
        --worker-class gthread
        api_service.app:app
    ports:
      - "5000:5000"
    environment:
      SCHEMA_SERVICE_URL:  http://schema_service:8002
      NL2SQL_DB_HOST:      postgres_nl2sql
      NL2SQL_DB_PORT:      "5432"
      NL2SQL_DB_NAME:      nl2sql
      NL2SQL_DB_USER:      nl2sql
      NL2SQL_DB_PASSWORD:  ${NL2SQL_DB_PASSWORD:-nl2sql}
      SECRET_KEY:          ${SECRET_KEY:-changeme_in_production}
      OMP_NUM_THREADS:     "4"
      CUDA_VISIBLE_DEVICES: ""
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      schema_service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_nl2sql_data:
    name: nl2sql_postgres_data

networks:
  nl2sql_net:
    name: nl2sql_net
    external: true
