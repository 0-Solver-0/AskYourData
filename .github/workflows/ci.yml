name: CI

on:
  pull_request:
    branches: [devlop, main]
  push:
    branches: [devlop, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.odoo.yml config --quiet
          docker network create nl2sql_net
          docker compose -f docker-compose.yml config --quiet
