# ══════════════════════════════════════════════════════════════════════════════
#  AskYourData — vocabulaire métier pour la recherche de tables (Odoo)
#  Un terme de la question (à gauche) ajoute des termes de recherche (à droite).
#  Sert à la correspondance de mots et enrichit le texte encodé de la question.
#  Monté dans schema_service : modifiable sans reconstruire l'image (aucune
#  réindexation nécessaire). Garder la liste courte et générique : les
#  descriptions précises des tables viendront de l'enrichissement (rôle PREP).
#  Éviter les termes trop génériques à droite (ex. « order » relierait ventes et achats).
# ══════════════════════════════════════════════════════════════════════════════

