# ══════════════════════════════════════════════════════════════════════════════
#  Profils de fournisseurs LLM (versionné, AUCUNE clé ici)
#
#  Chaque rôle choisit un profil dans .env :
#    PREP_PROVIDER / PREP_FALLBACK   découpage de la question
#    SQL_PROVIDER  / SQL_FALLBACK    génération et correction du SQL
#  La clé est lue dans la variable nommée par `api_key_env` (définie dans .env).
#
#  Champs :
#    base_url         URL de l'API au format chat completions (OpenAI) ; /chat/completions est ajouté
#    model            identifiant du modèle
#    api_key_env      nom de la variable d'environnement qui contient la clé
#    reasoning        paramètre de raisonnement : {param: nom du champ, default: valeur}
#                     (surchargeable par rôle : PREP_REASONING, SQL_REASONING)
#    max_tokens       plafond de sortie par défaut (raisonnement compris)
#    timeout_s        délai d'un appel
#    price_per_mtok   prix en dollars par million de tokens (coût calculé dans la télémétrie)
# ══════════════════════════════════════════════════════════════════════════════

# Muse Spark 1.3 sur l'API Meta — https://dev.meta.ai/docs/models#muse-spark (vérifié le 29/10/2026)
# Mode Standard : le contenu n'est pas utilisé pour l'entraînement.
meta_spark:
  base_url: https://api.meta.ai/v1
  model: muse-spark-1.3
  api_key_env: META_API_KEY
  reasoning: {param: reasoning_effort, default: low}   # minimal, low, medium, high, xhigh, max ("none" refusé)
  max_tokens: 4000
  timeout_s: 90
  price_per_mtok: {input: 1.25, cached_input: 0.15, output: 4.25}

# Muse Spark Open sur Baseten (crédits du hackathon) — testé le 29/10/2026 avec reasoning_effort=low
baseten_spark_open:
  base_url: https://inference.baseten.co/v1
  model: meta-models/muse-spark-open-1026
  api_key_env: BASETEN_API_KEY
  reasoning: {param: reasoning_effort, default: low}
  max_tokens: 8000
  timeout_s: 90
  price_per_mtok: {input: 1.25, cached_input: 0.15, output: 4.25}   # prix relevé chez un tiers

# Serveur local compatible OpenAI (vLLM, llama.cpp server, Ollama…)
local:
  base_url: http://localhost:8000/v1
  model: local-model
  api_key_env: LOCAL_API_KEY
  reasoning: null
  max_tokens: 4000
  timeout_s: 120
  price_per_mtok: {input: 0, cached_input: 0, output: 0}
